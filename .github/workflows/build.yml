name: Android Build (APK + AAB)

# Her push'ta ve elle tetiklemede calisir.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bagimliliklar
        run: flutter pub get

      # ── IMZA ANAHTARINI HAZIRLA ──
      # KEYSTORE_BASE64 secret'i varsa: keystore dosyasini ve key.properties'i
      # olustururuz -> release imzali (Play'e yuklenebilir) cikti alinir.
      # Secret yoksa: imzasiz/debug ile derlenir (yalniz test icin).
      - name: Imza anahtarini coz
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release imza anahtari hazir."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "UYARI: KEYSTORE_BASE64 secret'i yok -> imzasiz/debug derleme."
          fi

      # versionCode'u her derlemede otomatik artir (Play 'ayni surum kodu'
      # hatasini onler). Play'e her yuklemede bu deger buyumeli.
      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: AAB derle (Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # ── CIKTILARI YUKLE (Actions > ilgili run > Artifacts'tan indirilir) ──
      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: skt-takip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: AAB'yi yukle (Play icin)
        uses: actions/upload-artifact@v4
        with:
          name: skt-takip-aab-play
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
