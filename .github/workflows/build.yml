name: Android Build (APK + AAB)

# Her push'ta ve elle tetiklemede calisir.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Eski artifact'leri silebilmek icin 'actions: write';
# APK/AAB'yi Release'e yayinlayabilmek icin 'contents: write' gerekir.
permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # ── ESKI ARTIFACT'LERI SIL (depo kotasi) ──────────────────────────
      # Her derlemede ~100 MB APK+AAB birikiyordu ve kota dolunca
      # "Artifact storage quota has been hit" hatasi aliniyordu.
      # Derlemeden ONCE calisir ki yer acilmis olsun; hata verirse
      # derlemeyi durdurmaz (continue-on-error).
      - name: Eski artifact'leri temizle
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Once TUMUNU topla (silerken sayfalama kaymasin).
            const all = [];
            for (let page = 1; page <= 50; page++) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              all.push(...res.data.artifacts);
              if (res.data.artifacts.length < 100) break;
            }
            let deleted = 0, freed = 0, failed = 0;
            for (const a of all) {
              // Bu run'in kendi ciktilarina dokunma.
              if (a.workflow_run && a.workflow_run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: a.id,
                });
                deleted++;
                freed += a.size_in_bytes || 0;
              } catch (e) {
                failed++;
                core.info(`Silinemedi: ${a.name} (${e.message})`);
              }
            }
            core.notice(
              `${deleted} eski artifact silindi, ` +
              `${(freed / 1048576).toFixed(1)} MB boşaldı` +
              (failed ? `, ${failed} tanesi silinemedi` : '')
            );

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bagimliliklar
        run: flutter pub get

      # ── IMZA ANAHTARINI HAZIRLA ──
      # KEYSTORE_BASE64 secret'i varsa: keystore dosyasini ve key.properties'i
      # olustururuz -> release imzali (Play'e yuklenebilir) cikti alinir.
      # Secret yoksa: imzasiz/debug ile derlenir (yalniz test icin).
      - name: Imza anahtarini coz
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release imza anahtari hazir."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "UYARI: KEYSTORE_BASE64 secret'i yok -> imzasiz/debug derleme."
          fi

      # versionCode'u her derlemede otomatik artir (Play 'ayni surum kodu'
      # hatasini onler). Play'e her yuklemede bu deger buyumeli.
      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # ── CIKTILARI RELEASE'E YAYINLA (birincil dagitim) ────────────────
      # NEDEN: GitHub Actions "artifact" deposu kota dolunca yukleme
      # basarisiz oluyordu ("Artifact storage quota has been hit"). Release
      # varliklari (assets) BU KOTAYA DAHIL DEGILDIR ve ucretsizdir; bu
      # yuzden APK/AAB'yi tek, guncel bir on-surume ('ci-latest') koyariz.
      # Boylece kota dolu olsa bile her derlemede indirilebilir SABIT bir
      # link olur (telefona kurmak icin dogrudan APK).
      - name: APK'yi Release'e yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-latest"
          TITLE="SKT Takip — son derleme (#${{ github.run_number }})"
          NOTES="Otomatik derleme.
          Dal: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Derleme no: ${{ github.run_number }}

          Kurulum: asagidaki app-release.apk dosyasini telefona indirip acin."
          # Onceki 'ci-latest' surumunu ve etiketini temizle (tag guncel
          # commit'e tasinsin); ilk calismada yoksa hatayi yok say.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            build/app/outputs/flutter-apk/app-release.apk

      # ── ARTIFACT YUKLEME (ikincil / opsiyonel) ────────────────────────
      # Release birincil dagitimdir. Artifact yuklemesi de denenir ama kota
      # dolu olursa build'i KIRMIZI YAPMASIN diye continue-on-error.
      - name: APK'yi yukle (opsiyonel)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: skt-takip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          # Kota bir daha dolmasin: cikti 5 gun sonra kendiliginden silinir.
          retention-days: 5
          compression-level: 0  # APK zaten sikistirilmis; CPU harcamayalim
