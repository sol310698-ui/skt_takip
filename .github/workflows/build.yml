name: APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.0'

      - name: Repodaki kritik dosyaları yedekle
        run: |
          cp android/app/build.gradle /tmp/build.gradle.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest.bak
          mkdir -p /tmp/kotlin_bak
          cp -r android/app/src/main/kotlin /tmp/kotlin_bak/

      - name: Eksik platform dosyalarını oluştur
        run: flutter create --platforms=android .

      - name: Çakışan kts dosyalarını temizle
        run: |
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts

      - name: Kritik dosyaları geri yükle
        run: |
          cp /tmp/build.gradle.bak android/app/build.gradle
          cp /tmp/manifest.bak android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/kotlin_bak/kotlin android/app/src/main/kotlin

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "İmza anahtarı bulundu, hazırlanıyor..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/skt-takip.jks
            cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=skt-takip.jks
          EOF
          else
            echo "İmza anahtarı yok, debug imzası kullanılacak."
          fi

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: skt-takip-apk
          path: build/app/outputs/flutter-apk/app-release.apk
