plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.skt_takip"
    // ML Kit ve mobile_scanner için 34/35 önerilir
    compileSdk = 36
    // NDK uyumsuzluğunu önlemek için sürümü sabitliyoruz
    ndkVersion = "28.2.13676358"

    compileOptions {
        // flutter_local_notifications için zorunlu
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.skt_takip"
        // ML Kit ve camera için minSdk 21+ gerekli
        minSdk = 21
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // ML Kit native kütüphaneleri için
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // core library desugaring (flutter_local_notifications gereği)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"
}
