plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Sabit imza icin keystore bilgileri (CI'da Secret'tan gelir)
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.skt_takip"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.skt_takip"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Keystore varsa sabit imza, yoksa debug (gelistirme)
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
            // ── TERSINE MUHENDISLIK KORUMASI ──
            // R8 ile kod kucultme + obfuscation (sinif/metod/alan adlari
            // anlamsiz kisa isimlere donusturulur) + kullanilmayan kod/
            // kaynak temizligi. Kullaniciyi ETKILEMEZ (calisma zamani
            // davranisi degismez); sadece APK'yi decompile edenin
            // okuyacagi kodu anlamsizlastirir. Hangi siniflarin
            // KORUNACAGI (Flutter/plugin koprusu vb.) proguard-rules.pro
            // dosyasinda tanimlidir — o dosya olmadan minify acmak
            // uygulamayi CRASH ettirir.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
